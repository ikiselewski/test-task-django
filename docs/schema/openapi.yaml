openapi: 3.0.3
info:
  title: Genotype API
  description: |
    HTTP API for querying genotype records loaded from VCF files.

    Data is stored in a normalized biological schema:

      Species → Assembly → Chromosome → Coordinate
      Sample → Genotype (ref/alt alleles + GT)

    Coordinates are assembly-specific (e.g. GRCh38). Multiple samples
    (different people / VCF files) are supported.
  version: 1.1.0

servers:
  - url: http://127.0.0.1:8000
    description: Local development server

tags:
  - name: genotypes
    description: Query genotype calls

paths:
  /api/get_genotypes/:
    get:
      tags:
        - genotypes
      operationId: getGenotypes
      summary: List genotypes
      description: |
        Returns genotype records from the database. All query parameters are
        optional; when omitted, all stored genotypes are returned.

        - `chromosome` — exact contig match (e.g. `chr1`)
        - `coordinate` — exact 1-based genomic position (positive integer).
          Invalid values return HTTP 400.
        - `sample` — sample / individual name (e.g. `HG001`)
        - `assembly` — reference assembly name (e.g. `GRCh38`)
      parameters:
        - name: chromosome
          in: query
          required: false
          description: Chromosome / contig name filter (exact match).
          schema:
            type: string
            minLength: 1
            maxLength: 50
            example: chr1
        - name: coordinate
          in: query
          required: false
          description: Genomic position filter (exact match, VCF POS, >= 1).
          schema:
            type: integer
            minimum: 1
            example: 1234
        - name: sample
          in: query
          required: false
          description: Sample name filter (exact match).
          schema:
            type: string
            minLength: 1
            maxLength: 100
            example: HG001
        - name: assembly
          in: query
          required: false
          description: Reference assembly filter (exact match).
          schema:
            type: string
            minLength: 1
            maxLength: 50
            example: GRCh38
      responses:
        '200':
          description: Successful response with a list of genotypes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenotypeListResponse'
              examples:
                filtered:
                  summary: Filtered by chromosome and coordinate
                  value:
                    genotypes:
                      - chromosome: chr1
                        coordinate: 1234
                        ref: A
                        alt: T
                        gt: '0/1'
                        rsid: rs1
                        sample: HG001
                        assembly: GRCh38
                        species: Homo sapiens
                empty:
                  summary: No matching records
                  value:
                    genotypes: []
        '400':
          description: Invalid query parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryValidationError'
              example:
                error: Invalid query parameters
                details:
                  coordinate: Must be a positive integer.
        '405':
          description: Method not allowed (only GET is supported).
        '503':
          description: |
            Database schema is missing or outdated (e.g. migrations not applied).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseNotReadyError'
              example:
                error: Database not ready
                detail: >
                  Database schema is missing or outdated.
                  Run: python manage.py migrate
                  then load data with: python manage.py load_vcf <file.vcf>
                cause: 'no such table: api_coordinate'

components:
  schemas:
    Genotype:
      type: object
      description: |
        A genotype call for one sample at one genomic coordinate, loaded from VCF.
      required:
        - chromosome
        - coordinate
        - ref
        - alt
        - sample
        - assembly
        - species
      properties:
        chromosome:
          type: string
          maxLength: 50
          description: Contig identifier (e.g. `chr1`, `1`, `X`).
          example: chr1
        coordinate:
          type: integer
          description: 1-based genomic position (VCF POS).
          example: 1234
        ref:
          type: string
          maxLength: 512
          description: Reference allele (VCF REF).
          example: A
        alt:
          type: string
          maxLength: 512
          description: Alternate allele(s) (VCF ALT; comma-separated if multi-allelic).
          example: T
        gt:
          type: string
          nullable: true
          maxLength: 32
          description: |
            Genotype call from FORMAT/GT.
            Allele indices: 0=REF, 1=first ALT, …
            `/` unphased, `|` phased.
          example: '0/1'
        rsid:
          type: string
          nullable: true
          maxLength: 64
          description: Variant id from VCF ID column when present.
          example: rs1
        sample:
          type: string
          description: Sample / individual name.
          example: HG001
        assembly:
          type: string
          description: Reference genome assembly.
          example: GRCh38
        species:
          type: string
          description: Species scientific name.
          example: Homo sapiens
      additionalProperties: false

    GenotypeListResponse:
      type: object
      required:
        - genotypes
      properties:
        genotypes:
          type: array
          items:
            $ref: '#/components/schemas/Genotype'
      additionalProperties: false

    QueryValidationError:
      type: object
      required:
        - error
        - details
      properties:
        error:
          type: string
          example: Invalid query parameters
        details:
          type: object
          additionalProperties:
            type: string
          description: Map of parameter name to validation message.
      additionalProperties: false

    DatabaseNotReadyError:
      type: object
      required:
        - error
        - detail
      properties:
        error:
          type: string
          example: Database not ready
        detail:
          type: string
          description: Human-readable recovery hint (migrate / load_vcf).
        cause:
          type: string
          description: Underlying database error message when available.
      additionalProperties: false
